# world.blockle.org — static PWA + Colyseus websocket + REST API
# Installed at /etc/nginx/sites-available/world.blockle.org (certbot adds TLS).
server {
    server_name world.blockle.org;

    root /opt/world/client;
    index index.html;

    # static PWA; SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Colyseus matchmaking (HTTP) + rooms (WebSocket)
    location /colyseus/ {
        proxy_pass http://127.0.0.1:4567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API (auth, inventory, billing)
    location /api/ {
        proxy_pass http://127.0.0.1:4580/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
